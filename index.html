<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brief Journalier — Carrefour Narbonne HF7152</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap');

  :root {
    --blue: #003d8f;
    --red: #e20e17;
    --light-blue: #0066cc;
    --bg: #f0f3f8;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --green: #16a34a;
    --orange: #ea580c;
    --border: #d1d9e6;
    --alert: #fff7ed;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ─── HEADER ─── */
  .header {
    background: var(--blue);
    color: #fff;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .header-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-badge {
    width: 44px; height: 44px;
    background: var(--red);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: #fff;
    letter-spacing: -1px;
    flex-shrink: 0;
  }
  .header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.1; }
  .header-sub { font-size: 12px; opacity: 0.75; }
  .header-date { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; opacity: 0.85; text-align: right; }

  /* ─── MAIN CONTENT ─── */
  .container { max-width: 960px; margin: 0 auto; padding: 16px; }

  /* ─── CONTROLS ─── */
  .controls-card {
    background: var(--card);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }
  .control-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
  .control-group label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); letter-spacing: .5px; }
  select, .btn-file {
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: #fff;
    cursor: pointer;
    transition: border-color .2s;
  }
  select:focus { outline: none; border-color: var(--light-blue); }
  .btn-file input[type=file] { display: none; }
  .btn-file {
    display: flex; align-items: center; gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  .btn-file:hover { border-color: var(--light-blue); background: #f0f6ff; }
  .btn-file .icon { font-size: 16px; }
  .btn-file .fname { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
  .file-loaded { border-color: var(--green) !important; background: #f0fdf4 !important; }

  .btn-generate {
    padding: 10px 20px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background .2s;
    white-space: nowrap;
  }
  .btn-generate:hover { background: var(--light-blue); }
  .btn-print {
    padding: 10px 16px;
    background: #fff;
    color: var(--blue);
    border: 1.5px solid var(--blue);
    border-radius: 6px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-print:hover { background: var(--blue); color: #fff; }
  .btn-region {
    padding: 10px 16px;
    background: #fff;
    color: var(--orange);
    border: 1.5px solid var(--orange);
    border-radius: 6px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-region:hover { background: var(--orange); color: #fff; }
  .btn-region:disabled { opacity: .4; cursor: default; }

  /* ─── BRIEF CONTENT ─── */
  #brief-output { display: none; }

  .brief-header {
    background: linear-gradient(135deg, var(--blue) 60%, #0055b3);
    color: #fff;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: space-between;
    align-items: center;
  }
  .brief-rayon-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 800;
    line-height: 1.1;
  }
  .brief-rayon-id { font-size: 13px; opacity: .7; }
  .kpi-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .kpi {
    background: rgba(255,255,255,.12);
    border-radius: 8px;
    padding: 10px 14px;
    min-width: 110px;
    text-align: center;
  }
  .kpi-val {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
  }
  .kpi-label { font-size: 11px; opacity: .75; margin-top: 2px; }
  .up { color: #86efac; }
  .down { color: #fca5a5; }
  .neutral { color: #fde68a; }

  /* ─── SECTIONS ─── */
  .sections-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  @media (max-width: 600px) { .sections-grid { grid-template-columns: 1fr; } }

  .section-card {
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .section-card.full { grid-column: 1 / -1; }

  .section-head {
    padding: 10px 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: .3px;
  }
  .section-head.op { background: #eff6ff; color: var(--blue); border-bottom: 1px solid #dbeafe; }
  .section-head.clean { background: #f0fdf4; color: #166534; border-bottom: 1px solid #bbf7d0; }
  .section-head.alerte { background: #fff7ed; color: #9a3412; border-bottom: 1px solid #fed7aa; }
  .section-head.region { background: #fdf4ff; color: #6b21a8; border-bottom: 1px solid #e9d5ff; }

  .consignes-list { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .consigne {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    border-radius: 8px;
    background: #f9fafb;
    border-left: 3px solid transparent;
  }
  .consigne.op { border-left-color: var(--blue); }
  .consigne.clean { border-left-color: var(--green); }
  .consigne-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--blue);
    min-width: 22px;
    line-height: 1.3;
  }
  .consigne.clean .consigne-num { color: var(--green); }
  .consigne-text { font-size: 13.5px; line-height: 1.5; }
  .consigne-text strong { color: var(--text); }
  .consigne-text .tag {
    display: inline-block;
    background: #e0e7ff;
    color: var(--blue);
    font-size: 11px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 4px;
  }
  .consigne-text .tag.warn { background: #fff3cd; color: #92400e; }
  .consigne-text .tag.ok { background: #dcfce7; color: #166534; }
  .consigne-text .tag.err { background: #fee2e2; color: #991b1b; }

  /* ─── ALERTES ─── */
  .alert-row {
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .alert-chip {
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .alert-chip.warn { background: #fff3cd; color: #92400e; }
  .alert-chip.bad { background: #fee2e2; color: #991b1b; }
  .alert-chip.good { background: #dcfce7; color: #166534; }

  /* ─── CLASSEMENT REGION ─── */
  .region-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .region-table th {
    padding: 7px 10px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .region-table td { padding: 7px 10px; border-bottom: 1px solid #f0f3f8; }
  .region-table tr.highlight { background: #fffbeb; }
  .region-table tr.highlight td { font-weight: 600; }
  .rank-badge {
    display: inline-block;
    min-width: 26px;
    text-align: center;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    background: #e0e7ff;
    color: var(--blue);
  }
  .rank-badge.top3 { background: #fef9c3; color: #854d0e; }
  .rank-badge.narbonne { background: var(--blue); color: #fff; }

  /* ─── SIGNATURE ─── */
  .brief-footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 10px 0 20px;
  }

  /* ─── PRINT ─── */
  @media print {
    body { background: #fff; }
    .controls-card, .no-print { display: none !important; }
    #brief-output { display: block !important; }
    .header { background: #003d8f !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .brief-header { background: #003d8f !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .section-head.op, .section-head.clean, .section-head.alerte, .section-head.region { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sections-grid { grid-template-columns: 1fr 1fr; }
    .container { padding: 0 10px; }
  }
</style>
</head>

// ═══════════════════════════════════════════════════════════
// CONSIGNES PAR TYPE DE RAYON
// ═══════════════════════════════════════════════════════════
function getConsignes(rayon) {
  const op = [];
  const clean = [];
  const type = rayon.type;
  const stkNeg = rayon.stkNeg;
  const rupt = rayon.ruptAssort;

  // ─────────────────────────────────────────────
  // PGC (hors PLS)
  // ─────────────────────────────────────────────
  if (type === "alim_pgc") {
    op.push(`<strong>Contrôle DLC / DDM obligatoire :</strong> Effectuer un tour complet du rayon et retirer tout produit dont la date est dépassée ou à moins de 3 jours. Vérifier en priorité les zones de bas-de-rayon et les têtes de gondole.`);
    op.push(`<strong>Chasse aux ruptures & commande :</strong> Identifier chaque référence absente du linéaire. Pour chaque rupture confirmée : 1) vérifier le stock informatique, 2) corriger si stock négatif ou erroné, 3) <em>commander 1 carton en commande client</em> pour relancer la commande automatique.`);
    op.push(`<strong>Mise à jour des SMP :</strong> Sur les références en rupture traitées, vérifier que le Stock Mini Permanent est cohérent avec la rotation. Si le SMP est à 0 ou sous-évalué, l'ajuster pour éviter les ruptures futures.`);

    // Propreté PGC : rangement réserve + vérification linéaire
    clean.push(`<strong>Rangement de la réserve :</strong> Ranger la réserve, évacuer les cartons vides et les emballages, vérifier que les allées de sécurité sont dégagées.`);
    clean.push(`<strong>Vérification du linéaire — étagères & rayonnages :</strong> Contrôler l'état de chaque étagère, redresser les articles tombés ou mal positionnés, vérifier que les tablettes sont propres et stables.`);
    clean.push(`<strong>Facing & tenue générale du rayon :</strong> Remettre chaque produit face-client sur l'ensemble des emplacements, combler les trous de présentation, vérifier l'affichage des prix et retirer les étiquettes obsolètes.`);
  }

  // ─────────────────────────────────────────────
  // PLS
  // ─────────────────────────────────────────────
  else if (type === "alim_pls") {
    op.push(`<strong>Contrôle DLC produits frais LS :</strong> Effectuer un tour complet des meubles réfrigérés et retirer tout produit dont la DLC est dépassée ou à moins de 3 jours. Vérifier les étiquettes de traçabilité et l'intégrité des emballages.`);
    op.push(`<strong>Chasse aux ruptures & commande :</strong> Identifier chaque référence absente. Pour chaque rupture : 1) vérifier le stock informatique, 2) corriger si stock négatif ou erroné, 3) <em>commander 1 carton en commande client</em> pour relancer la commande automatique.`);
    op.push(`<strong>Mise à jour des SMP :</strong> Sur les références en rupture traitées, vérifier la cohérence du Stock Mini Permanent avec la rotation journalière. Ajuster si le SMP est à 0 ou sous-dimensionné.`);

    // Propreté PLS : réserve + meubles froids (températures)
    clean.push(`<strong>Rangement de la réserve :</strong> Ranger la chambre froide et la réserve PLS, évacuer les cartons vides, vérifier que les allées sont dégagées et que les produits sont bien identifiés.`);
    clean.push(`<strong>Vérification & nettoyage des meubles froids :</strong> Contrôler les températures de chaque meuble réfrigéré (maxi +4 °C pour les frais, -18 °C pour les surgelés). Nettoyer les vitrines, joints et étagères des meubles. Signaler toute anomalie thermique.`);
    clean.push(`<strong>Tenue du linéaire — étagères & rayonnages :</strong> Vérifier l'état et la propreté des étagères, redresser les articles mal positionnés, contrôler l'affichage des prix et retirer les étiquettes de références absentes.`);
  }

  // ─────────────────────────────────────────────
  // PFT
  // ─────────────────────────────────────────────
  else if (type === "alim_pft") {
    if (rayon.num === "20" || rayon.num === "21" || rayon.num === "24") {
      op.push(`<strong>Traçabilité & origine obligatoires :</strong> Vérifier que chaque produit en vitrine dispose de sa fiche traçabilité complète (numéro de lot, date de réception, origine géographique). Contrôler l'affichage réglementaire de l'origine sur les étiquettes.`);
    } else if (rayon.num === "22") {
      op.push(`<strong>Traçabilité & fiches origine :</strong> Vérifier que les étiquettes affichent l'origine de chaque produit (pays + exploitation si bio). Retirer tout produit sans fiche traçabilité conforme. Contrôler la fraîcheur visuelle de l'ensemble de l'étalage.`);
    } else if (rayon.num === "23") {
      op.push(`<strong>Étiquetage allergènes & DLC :</strong> Contrôler que l'affichage des 14 allergènes réglementaires est présent et lisible pour chaque produit fabriqué sur place. Vérifier les DLC des produits et retirer ceux arrivés à date.`);
    } else {
      op.push(`<strong>Contrôle DLC & qualité produits frais :</strong> Vérifier les DLC de tous les produits en vitrine et en réserve. Retirer tout produit arrivé à date ou présentant des défauts d'aspect. Contrôler l'intégrité des conditionnements.`);
    }
    op.push(`<strong>Chasse aux ruptures & stock :</strong> Identifier chaque emplacement vide. Pour chaque rupture : 1) vérifier le stock informatique, 2) corriger si stock négatif ou erroné, 3) <em>commander 1 carton en commande client</em> pour relancer la commande automatique.`);
    op.push(`<strong>Mise à jour des SMP :</strong> Sur les références traitées en rupture, vérifier la cohérence du Stock Mini Permanent avec la rotation. Si le SMP est à 0 ou sous-évalué, l'ajuster. Contrôler le coût d'achat des dernières réceptions pour veiller à la tenue de marge.`);

    // Propreté PFT : réserve + meubles froids + plan HACCP
    clean.push(`<strong>Nettoyage & désinfection des meubles froids :</strong> Contrôler les températures de chaque meuble ou vitrine réfrigérée. Nettoyer les vitrines, joints, bacs et étagères selon le plan HACCP. Signaler toute anomalie thermique dans le cahier d'hygiène.`);
    clean.push(`<strong>Rangement de la réserve & chambre froide :</strong> Ranger la réserve et la chambre froide, évacuer les déchets et emballages de découpe, vérifier que les allées et sorties de secours sont dégagées.`);
    clean.push(`<strong>Nettoyage plans de travail & zone de production :</strong> Désinfecter les plans de travail, planches et ustensiles après chaque utilisation. Nettoyer le sol de la zone PFT et consigner les opérations dans le cahier d'hygiène.`);
  }

  // ─────────────────────────────────────────────
  // NON ALIMENTAIRE
  // ─────────────────────────────────────────────
  else if (type === "non_alim") {
    op.push(`<strong>Facing & rangement complet du rayon :</strong> Remettre chaque article à sa place selon le plan de masse, effectuer un facing soigné face-client sur toutes les étagères. Vérifier le balisage prix de chaque référence et corriger les erreurs d'affichage.`);
    op.push(`<strong>Chasse aux ruptures — commander 1 carton :</strong> Identifier toutes les références manquantes en rayon. Pour chaque rupture : 1) vérifier le stock informatique, 2) si stock négatif ou nul par erreur corriger le stock, 3) <em>commander 1 carton en commande client</em> pour relancer la commande automatique.`);
    op.push(`<strong>Mise à jour des SMP :</strong> Pour chaque référence traitée en rupture, vérifier que le SMP est cohérent avec la vitesse de vente. Si SMP = 0 ou sous-évalué, le corriger pour sécuriser le réapprovisionnement automatique.`);

    // Propreté Non Alim : rangement réserve + vérification linéaire
    clean.push(`<strong>Rangement de la réserve :</strong> Ranger la réserve, évacuer les cartons vides et emballages, vérifier que les allées et sorties de secours sont libres. Contrôler l'état du mobilier de stockage.`);
    clean.push(`<strong>Vérification du linéaire — étagères & rayonnages :</strong> Contrôler l'état de chaque étagère et rayonnage, redresser les articles tombés ou mal positionnés, vérifier la stabilité des tablettes et signaler toute dégradation du mobilier.`);
    clean.push(`<strong>Tenue visuelle du rayon :</strong> Dépoussiérer les étagères et les articles en exposition, soigner la présentation des têtes de gondole, vérifier que l'allée centrale et les allées secondaires sont propres et dégagées.`);
  }

  return { op, clean };
}

// GÉNÉRATION DU BRIEF
// ═══════════════════════════════════════════════════════════
let currentRayonKey = null;

function generateBrief() {
  const key = document.getElementById("select-rayon").value;
  if (!key) { alert("Veuillez choisir un rayon."); return; }
  currentRayonKey = key;

  const rayon = RAYONS[key];
  if (!rayon) { alert("Données non disponibles pour ce rayon."); return; }

  const { op, clean } = getConsignes(rayon);

  // KPIs header
  const evolSign = rayon.evolCA >= 0 ? "up" : "down";
  const margeSign = rayon.diffMarge >= 0 ? "up" : "down";
  const budgSign = rayon.budget >= 0 ? "up" : "down";
  const rangSign = rayon.evolRang > 0 ? "up" : rayon.evolRang < 0 ? "down" : "neutral";

  // Alertes
  const alertes = [];
  if (rayon.stkNeg > 20) alertes.push({type:"bad", label:`⚠ ${rayon.stkNeg} stocks négatifs`});
  else if (rayon.stkNeg > 0) alertes.push({type:"warn", label:`${rayon.stkNeg} stocks négatifs`});
  if (rayon.ruptAssort > 50) alertes.push({type:"bad", label:`⚠ ${rayon.ruptAssort} ruptures assortiment`});
  else if (rayon.ruptAssort > 0) alertes.push({type:"warn", label:`${rayon.ruptAssort} ruptures assortiment`});
  if (rayon.evolCA < -15) alertes.push({type:"bad", label:`CA en forte baisse ${rayon.evolCA}%`});
  if (rayon.diffMarge < -3) alertes.push({type:"bad", label:`Marge en recul de ${rayon.diffMarge.toFixed(1)} pts`});
  if (rayon.diffMarge > 2) alertes.push({type:"good", label:`✓ Marge en progression +${rayon.diffMarge.toFixed(1)} pts`});
  if (rayon.evolRang > 10) alertes.push({type:"good", label:`✓ Progression région +${rayon.evolRang} rangs`});
  if (rayon.budget < -2) alertes.push({type:"warn", label:`Écart budget ${rayon.budget.toFixed(1)} K€`});
  if (alertes.length === 0) alertes.push({type:"good", label:"✓ Situation globale correcte"});

  // Region button
  const hasRegion = !!REGION_DATA[key];
  document.getElementById("btn-region").disabled = !hasRegion;

  const html = `
  <div class="brief-header">
    <div>
      <div class="brief-rayon-id">Rayon ${rayon.num} · ${rayon.parent} · ${STORE.magasin}</div>
      <div class="brief-rayon-name">${rayon.nom}</div>
      <div style="font-size:12px;opacity:.65;margin-top:4px">${STORE.date} — Source Darwin</div>
    </div>
    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-val ${evolSign}">${rayon.ca.toFixed(1)} K€</div>
        <div class="kpi-label">CA Jour</div>
      </div>
      <div class="kpi">
        <div class="kpi-val ${evolSign}">${rayon.evolCA > 0 ? '+' : ''}${rayon.evolCA.toFixed(1)}%</div>
        <div class="kpi-label">Évol vs N-1</div>
      </div>
      <div class="kpi">
        <div class="kpi-val ${margeSign}">${rayon.taux.toFixed(1)}%</div>
        <div class="kpi-label">Taux Marge</div>
      </div>
      <div class="kpi">
        <div class="kpi-val ${margeSign}">${rayon.diffMarge > 0 ? '+' : ''}${rayon.diffMarge.toFixed(2)} pts</div>
        <div class="kpi-label">Diff Marge N-1</div>
      </div>
      <div class="kpi">
        <div class="kpi-val ${budgSign}">${rayon.budget > 0 ? '+' : ''}${rayon.budget.toFixed(1)} K€</div>
        <div class="kpi-label">Écart Budget</div>
      </div>
      <div class="kpi">
        <div class="kpi-val ${rangSign}">Rang ${rayon.rang}</div>
        <div class="kpi-label">Région (${rayon.evolRang > 0 ? '+' : ''}${rayon.evolRang})</div>
      </div>
    </div>
  </div>

  <div class="section-card full" style="margin-bottom:14px">
    <div class="section-head alerte">⚡ Points d'attention du jour</div>
    <div class="alert-row">
      ${alertes.map(a => `<span class="alert-chip ${a.type}">${a.label}</span>`).join('')}
    </div>
  </div>

  <div class="sections-grid">
    <div class="section-card">
      <div class="section-head op">⚙️ Consignes Opérationnelles (3 priorités)</div>
      <div class="consignes-list">
        ${op.map((c,i) => `<div class="consigne op"><div class="consigne-num">${i+1}</div><div class="consigne-text">${c}</div></div>`).join('')}
      </div>
    </div>
    <div class="section-card">
      <div class="section-head clean">🧹 Propreté & Tenue du Rayon</div>
      <div class="consignes-list">
        ${clean.map((c,i) => `<div class="consigne clean"><div class="consigne-num">${i+1}</div><div class="consigne-text">${c}</div></div>`).join('')}
      </div>
    </div>
  </div>

  <div id="region-section" style="display:none"></div>

  <div class="brief-footer">
    Brief généré le ${STORE.date} — Carrefour ${STORE.magasin} — Confidentiel Carrefour
  </div>
  `;

  document.getElementById("brief-content").innerHTML = html;
  document.getElementById("brief-output").style.display = "block";
  document.getElementById("brief-output").scrollIntoView({behavior:"smooth", block:"start"});
}

        <table class="region-table">
          <thead>
            <tr>
              <th>Rang</th>
              <th>Magasin</th>
              <th>CA (K€)</th>
              <th>Évol %</th>
              <th>Débits</th>
              <th>Panier</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;

  const section = document.getElementById("region-section");
  section.style.display = "block";
  section.innerHTML = html;
  section.scrollIntoView({behavior:"smooth"});
}

// ── File upload handlers ──
function setupFileInput(inputId, labelId, fnameId) {
  document.getElementById(inputId).addEventListener('change', function() {
    if (this.files[0]) {
      document.getElementById(fnameId).textContent = this.files[0].name;
      document.getElementById(labelId).classList.add('file-loaded');
    }
  });
}
setupFileInput('file-perf', 'lbl-perf', 'fname-perf');
setupFileInput('file-rayons', 'lbl-rayons', 'fname-rayons');
setupFileInput('file-compar', 'lbl-compar', 'fname-compar');
</script>
